server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;  # phone photos of bills are bigger than nginx's 1 MB default

  # Django handles the API, the admin panel and its static files.
  # $http_host keeps the port (localhost:3000) so Django's CSRF check accepts the admin login.
  location /api/    { proxy_pass http://api:8000; proxy_set_header Host $http_host; }
  location /admin/  { proxy_pass http://api:8000; proxy_set_header Host $http_host; }
  location /static/ { proxy_pass http://api:8000; proxy_set_header Host $http_host; }

  # Everything else is the React app.
  location / { try_files $uri /index.html; }
}
